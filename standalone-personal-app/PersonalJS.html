<script>
/**
 * PersonalJS.html - Client-Side Controller with IndexedDB Hybrid Cache
 */

// ==========================================
// 1. INDEXEDDB HYBRID STORAGE MANAGER
// ==========================================
window.StorageManager = (function() {
  var DB_NAME = 'Personal_QA_Cache';
  var STORE_NAME = 'app_cache';
  var DB_VERSION = 1;
  var CACHE_KEY = 'personal_eval_data';

  function _openDB() {
    return new Promise(function(resolve, reject) {
      if (!window.indexedDB) return reject(new Error('IndexedDB not supported'));
      try {
        var req = indexedDB.open(DB_NAME, DB_VERSION);
        req.onupgradeneeded = function(e) {
          var db = e.target.result;
          if (!db.objectStoreNames.contains(STORE_NAME)) {
            db.createObjectStore(STORE_NAME, { keyPath: 'id' });
          }
        };
        req.onsuccess = function(e) { resolve(e.target.result); };
        req.onerror = function(e) { reject(e.target.error); };
      } catch (err) {
        reject(err);
      }
    });
  }

  return {
    get: function() {
      return _openDB().then(function(db) {
        return new Promise(function(resolve) {
          try {
            var tx = db.transaction(STORE_NAME, 'readonly');
            var store = tx.objectStore(STORE_NAME);
            var req = store.get(CACHE_KEY);
            req.onsuccess = function() {
              db.close();
              resolve(req.result ? req.result.payload : null);
            };
            req.onerror = function() {
              db.close();
              resolve(null);
            };
          } catch(e) {
            db.close();
            resolve(null);
          }
        });
      }).catch(function() {
        try {
          var ls = localStorage.getItem('personal_qa_cache');
          return Promise.resolve(ls ? JSON.parse(ls) : null);
        } catch(e) {
          return Promise.resolve(null);
        }
      });
    },

    set: function(payload) {
      var item = { id: CACHE_KEY, payload: payload, timestamp: Date.now() };
      return _openDB().then(function(db) {
        return new Promise(function(resolve) {
          try {
            var tx = db.transaction(STORE_NAME, 'readwrite');
            var store = tx.objectStore(STORE_NAME);
            store.put(item);
            tx.oncomplete = function() { db.close(); resolve(true); };
            tx.onerror = function() { db.close(); resolve(false); };
          } catch(e) {
            db.close();
            resolve(false);
          }
        });
      }).catch(function() {
        try {
          localStorage.setItem('personal_qa_cache', JSON.stringify(payload));
          return Promise.resolve(true);
        } catch(e) {
          return Promise.resolve(false);
        }
      });
    }
  };
})();

// ==========================================
// 2. STATE MANAGEMENT
// ==========================================
var state = {
  userEmail: window.CURRENT_USER_EMAIL || '',
  assignments: [],
  evaluations: [],
  rubrics: [],
  currentView: 'daily',
  currentDate: new Date(),
  searchTerm: ''
};

// ==========================================
// 3. INITIALIZATION (0ms Load Strategy)
// ==========================================
document.addEventListener('DOMContentLoaded', function() {
  updateDateDisplay();

  // STEP 1: Instant load from IndexedDB (0ms)
  window.StorageManager.get().then(function(cached) {
    if (cached && cached.assignments) {
      state.assignments = cached.assignments || [];
      state.evaluations = cached.evaluations || [];
      state.rubrics = cached.rubrics || [];
      renderTable();
      calculateCounters();
    }
    // STEP 2: Background delta fetch from Google Apps Script & Supabase
    fetchBackendData(false);
  });
});

function fetchBackendData(showLoader, callback) {
  if (showLoader) {
    document.getElementById('evaluationTableBody').innerHTML = 
      '<tr><td colspan="11" class="text-center py-5"><div class="spinner-border text-orange spinner-border-sm mb-2"></div><p class="mb-0 text-muted small">Refreshing data...</p></td></tr>';
  }

  google.script.run
    .withSuccessHandler(function(res) {
      if (typeof callback === 'function') callback();
      if (res && res.success) {
        state.assignments = res.assignments || [];
        state.evaluations = res.evaluations || [];
        if (res.rubrics && Array.isArray(res.rubrics)) {
          state.rubrics = res.rubrics;
        }
        
        // Persist to IndexedDB
        window.StorageManager.set({
          assignments: state.assignments,
          evaluations: state.evaluations,
          rubrics: state.rubrics
        });

        renderTable();
        calculateCounters();
      } else {
        showToast('Error: ' + ((res && res.error) || 'Failed to fetch data'), 'danger');
      }
    })
    .withFailureHandler(function(err) {
      if (typeof callback === 'function') callback();
      showToast('Connection failed: ' + err.message, 'danger');
    })
    .getInitialData(state.userEmail);
}

function manualRefresh() {
  var btn = document.getElementById('btnManualRefresh');
  if (btn) {
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm text-secondary" role="status" style="width: 1rem; height: 1rem;"></span>';
  }
  fetchBackendData(true, function() {
    if (btn) {
      btn.disabled = false;
      btn.innerHTML = '<i class="bi bi-arrow-clockwise text-secondary fs-6"></i>';
    }
  });
}

// ==========================================
// 4. DATE NAVIGATION & FILTERING
// ==========================================
function setViewType(type) {
  state.currentView = type;
  document.getElementById('viewDailyBtn').classList.toggle('active', type === 'daily');
  document.getElementById('viewWeeklyBtn').classList.toggle('active', type === 'weekly');
  document.getElementById('viewMonthlyBtn').classList.toggle('active', type === 'monthly');
  updateDateDisplay();
  renderTable();
  calculateCounters();
}

function navigateDate(delta) {
  var d = new Date(state.currentDate);
  if (state.currentView === 'daily') {
    d.setDate(d.getDate() + delta);
  } else if (state.currentView === 'weekly') {
    d.setDate(d.getDate() + (delta * 7));
  } else if (state.currentView === 'monthly') {
    d.setMonth(d.getMonth() + delta);
  }
  state.currentDate = d;
  updateDateDisplay();
  renderTable();
  calculateCounters();
}

function jumpToCurrent() {
  state.currentDate = new Date();
  updateDateDisplay();
  renderTable();
  calculateCounters();
}

function getMonday(d) {
  var date = new Date(d);
  date.setDate(date.getDate() - date.getDay() + (date.getDay() === 0 ? -6 : 1));
  date.setHours(0,0,0,0);
  return date;
}

function getWeekLabel(d) {
  var s = getMonday(d), e = new Date(s);
  e.setDate(s.getDate() + 6);
  return 'WE ' + String(e.getMonth()+1).padStart(2,'0') + '.' + String(e.getDate()).padStart(2,'0') + '.' + e.getFullYear();
}

function getMonthLabel(d) {
  return d.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
}

function updateDateDisplay() {
  var el = document.getElementById('dateFilterDisplay');
  if (!el) return;
  var d = state.currentDate;
  
  if (state.currentView === 'daily') {
    el.textContent = d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
  } else if (state.currentView === 'weekly') {
    el.textContent = getWeekLabel(d);
  } else if (state.currentView === 'monthly') {
    el.textContent = getMonthLabel(d);
  }
}

function parseLocalDate(dateStr) {
  if (!dateStr) return null;
  if (dateStr instanceof Date) return dateStr;
  var str = String(dateStr).split('T')[0].trim();
  var parts = str.split('-');
  if (parts.length === 3) {
    return new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, parseInt(parts[2], 10));
  }
  var d = new Date(dateStr);
  return isNaN(d.getTime()) ? null : d;
}

// Check if an item falls in the selected viewing window
function isInCurrentPeriod(dateStr) {
  if (!dateStr) return true;
  var itemDate = parseLocalDate(dateStr);
  if (!itemDate) return true;

  var cur = state.currentDate;
  if (state.currentView === 'daily') {
    return itemDate.getFullYear() === cur.getFullYear() &&
           itemDate.getMonth() === cur.getMonth() &&
           itemDate.getDate() === cur.getDate();
  } else if (state.currentView === 'weekly') {
    var start = getMonday(cur);
    var end = new Date(start);
    end.setDate(start.getDate() + 6);
    end.setHours(23,59,59,999);
    return itemDate >= start && itemDate <= end;
  } else if (state.currentView === 'monthly') {
    return itemDate.getFullYear() === cur.getFullYear() &&
           itemDate.getMonth() === cur.getMonth();
  }
  return true;
}

// ==========================================
// 5. SEARCH HANDLERS
// ==========================================
function handleSearch(val) {
  state.searchTerm = String(val || '').trim().toLowerCase();
  document.getElementById('clearSearchBtn').classList.toggle('d-none', !state.searchTerm);
  renderTable();
}

function clearSearch() {
  document.getElementById('searchInteractionId').value = '';
  state.searchTerm = '';
  document.getElementById('clearSearchBtn').classList.add('d-none');
  renderTable();
}

// ==========================================
// 6. TABLE RENDERING
// ==========================================
function renderTable() {
  var tbody = document.getElementById('evaluationTableBody');
  var evalsMap = {};
  state.evaluations.forEach(function(e) {
    if (e.assignment_id) evalsMap[e.assignment_id] = e;
    if (e.id) evalsMap[e.id] = e;
  });

  // Combine items for display
  var rows = [];
  state.assignments.forEach(function(a) {
    if (!isInCurrentPeriod(a.date)) return;
    var ev = evalsMap[a.id] || null;
    rows.push({ assignment: a, evaluation: ev });
  });

  // Also include standalone evaluations not linked to assignment in period
  state.evaluations.forEach(function(ev) {
    if (ev.assignment_id && state.assignments.some(function(a){ return a.id === ev.assignment_id; })) {
      return; // Already accounted for
    }
    if (isInCurrentPeriod(ev.submitted_at || ev.date_of_interaction)) {
      rows.push({ assignment: null, evaluation: ev });
    }
  });

  // Filter by search term
  if (state.searchTerm) {
    rows = rows.filter(function(r) {
      var intId = (r.evaluation && r.evaluation.interaction_id) || '';
      var agentName = (r.assignment && r.assignment.agent_name) || (r.evaluation && r.evaluation.agent_name) || '';
      var agentEmail = (r.assignment && r.assignment.agent_email) || (r.evaluation && r.evaluation.agent_email) || '';
      return intId.toLowerCase().includes(state.searchTerm) ||
             agentName.toLowerCase().includes(state.searchTerm) ||
             agentEmail.toLowerCase().includes(state.searchTerm);
    });
  }

  if (rows.length === 0) {
    tbody.innerHTML = '<tr><td colspan="11" class="text-center py-5 text-muted small"><i class="bi bi-inbox fs-3 d-block mb-1 text-secondary"></i>No records found for this viewing period. Click <b>Fetch Sheet Assignments</b> to pull your bucket.</td></tr>';
    return;
  }

  var html = '';
  rows.forEach(function(r) {
    var a = r.assignment;
    var ev = r.evaluation;
    var snap = (a && a.agent_snapshot) || (ev && ev.agent_snapshot) || {};
    if (typeof snap === 'string') {
      try { snap = JSON.parse(snap); } catch(e) { snap = {}; }
    }

    var eid = snap.eid || snap.employeeId || '-';
    var agentName = (a && a.agent_name) || (ev && ev.agent_name) || (snap.fullName || snap.displayName || 'Unknown');
    var agentEmail = (a && a.agent_email) || (ev && ev.agent_email) || '';
    var interactionId = (ev && ev.interaction_id) ? ev.interaction_id : '-';
    var location = snap.location || '-';
    var supervisor = snap.supervisor || '-';
    var skill = snap.skill || '-';
    var channel = snap.channel || '-';
    var role = snap.role || 'Agent';

    var isCompleted = !!ev || (a && String(a.status).toLowerCase() === 'completed');
    var status = isCompleted ? 'Completed' : ((a && a.status) || 'Pending');
    var scoreVal = (ev && ev.score !== undefined && ev.score !== null) ? Number(ev.score) : null;

    // Score Badge
    var scoreBadge = '<span class="text-muted small">-</span>';
    if (scoreVal !== null) {
      var sClass = scoreVal >= 85 ? 'score-good' : (scoreVal >= 70 ? 'score-fair' : 'score-poor');
      scoreBadge = '<span class="score-badge ' + sClass + '">' + scoreVal.toFixed(1) + '%</span>';
    }

    // Status & Sync Badges
    var statusBadge = '';
    if (isCompleted) {
      statusBadge = '<span class="badge bg-success px-2 py-1 rounded-pill">Completed</span>';
    } else {
      statusBadge = '<span class="badge bg-warning text-dark px-2 py-1 rounded-pill">Pending</span>';
    }

    // Action Buttons
    var actionBtn = '';
    if (ev) {
      if (ev.synced_to_sheet) {
        actionBtn = '<div class="d-flex justify-content-end gap-1">' +
          '<button class="btn btn-sm btn-light border text-success px-2.5 py-1 rounded-pill shadow-sm" onclick="viewDetails(\'' + ev.id + '\')" title="Synced to Sheet - Click to view details"><i class="bi bi-eye me-1"></i>Synced</button>' +
          '</div>';
      } else {
        actionBtn = '<div class="d-flex justify-content-end gap-1">' +
          '<button class="btn btn-sm btn-orange px-2.5 py-1 rounded-pill shadow-sm" onclick="syncSingleEval(\'' + ev.id + '\')" title="Push to Team Google Sheet"><i class="bi bi-cloud-arrow-up-fill me-1"></i>Sync</button>' +
          '<button class="btn btn-sm btn-outline-secondary px-2 py-1 rounded-pill shadow-sm" onclick="viewDetails(\'' + ev.id + '\')" title="View details"><i class="bi bi-eye"></i></button>' +
          '</div>';
      }
    } else if (a && String(a.status).toLowerCase() === 'completed') {
      actionBtn = '<div class="d-flex justify-content-end gap-1">' +
        '<button class="btn btn-sm btn-light border text-success px-2.5 py-1 rounded-pill shadow-sm" onclick="fetchSheetAssignments()" title="Completed on Sheet - Click to refresh details"><i class="bi bi-eye me-1"></i>Synced</button>' +
        '</div>';
    } else {
      actionBtn = '<span class="text-muted small fst-italic">Awaiting review</span>';
    }

    html += '<tr>' +
      '<td class="ps-4 fw-bold text-secondary font-monospace small">' + eid + '</td>' +
      '<td><div class="fw-bold text-dark">' + agentName + '</div><div class="text-muted small" style="font-size: 0.75rem;">' + agentEmail + '</div></td>' +
      '<td class="font-monospace small">' + interactionId + '</td>' +
      '<td class="small text-muted">' + location + '</td>' +
      '<td class="small text-muted">' + supervisor + '</td>' +
      '<td class="small text-muted">' + skill + '</td>' +
      '<td class="small text-muted">' + channel + '</td>' +
      '<td class="small text-muted">' + role + '</td>' +
      '<td class="text-center">' + statusBadge + '</td>' +
      '<td class="text-center">' + scoreBadge + '</td>' +
      '<td class="text-end pe-4">' + actionBtn + '</td>' +
      '</tr>';
  });

  tbody.innerHTML = html;
}

// ==========================================
// 7. COUNTERS CALCULATION
// ==========================================
function calculateCounters() {
  var total = 0;
  var pending = 0;
  var completed = 0;

  var evalsMap = {};
  state.evaluations.forEach(function(e) {
    if (e.assignment_id) evalsMap[e.assignment_id] = e;
  });

  state.assignments.forEach(function(a) {
    if (!isInCurrentPeriod(a.date)) return;
    total++;
    if (evalsMap[a.id] || a.status === 'Completed') {
      completed++;
    } else {
      pending++;
    }
  });

  var rate = total > 0 ? Math.round((completed / total) * 100) : 0;

  document.getElementById('countTotal').textContent = total;
  document.getElementById('totalEvaluatedLabel').textContent = completed + ' / ' + total;
  document.getElementById('countPending').textContent = pending;
  document.getElementById('countSubPending').textContent = pending;
  document.getElementById('countCompleted').textContent = completed;
  document.getElementById('countSubCompleted').textContent = completed;
  document.getElementById('countRate').textContent = rate + '%';
  document.getElementById('rateSubCompleted').textContent = rate + '% (' + completed + ')';

  var periodLabel = state.currentView === 'daily' ? 'Day View' : (state.currentView === 'weekly' ? 'Week View' : 'Month View');
  document.getElementById('totalPeriodLabel').textContent = periodLabel;
}

// ==========================================
// 8. SYNC ACTIONS
// ==========================================

// Pull assigned agents from team sheet into Supabase
function fetchSheetAssignments() {
  var btn = document.getElementById('btnFetchSheet');
  if (btn) {
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm text-primary" role="status" style="width: 1rem; height: 1rem;"></span>';
  }

  google.script.run
    .withSuccessHandler(function(res) {
      if (btn) {
        btn.disabled = false;
        btn.innerHTML = '<i class="bi bi-cloud-arrow-down-fill text-primary fs-6"></i>';
      }
      if (res && res.success) {
        showToast(res.message || 'Assignments updated from Team Sheet!', 'success');
        fetchBackendData(false);
      } else {
        showToast('Error: ' + ((res && res.error) || 'Failed to fetch assignments'), 'danger');
      }
    })
    .withFailureHandler(function(err) {
      if (btn) {
        btn.disabled = false;
        btn.innerHTML = '<i class="bi bi-cloud-arrow-down-fill text-primary fs-6"></i>';
      }
      showToast('Fetch failed: ' + err.message, 'danger');
    })
    .fetchTeamAssignments(state.userEmail);
}

// Sync single evaluation to team sheet
function syncSingleEval(evalId) {
  showToast('Syncing evaluation to Team Sheet...', 'info');

  google.script.run
    .withSuccessHandler(function(res) {
      if (res && res.success) {
        showToast('Evaluation synced to Team Google Sheet! (Row: ' + res.sheetRowId + ')', 'success');
        // Update local state
        var ev = state.evaluations.find(function(e){ return e.id === evalId; });
        if (ev) ev.synced_to_sheet = true;
        window.StorageManager.set({ assignments: state.assignments, evaluations: state.evaluations });
        renderTable();
      } else {
        showToast('Sync error: ' + ((res && res.error) || 'Failed to sync'), 'danger');
      }
    })
    .withFailureHandler(function(err) {
      showToast('Sync failed: ' + err.message, 'danger');
    })
    .syncEvaluationToTeamSheet(evalId);
}

// Sync all pending evaluations to team sheet
function syncAllPending() {
  var btn = document.getElementById('btnSyncAll');
  if (btn) {
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm text-orange" role="status" style="width: 1rem; height: 1rem;"></span>';
  }

  google.script.run
    .withSuccessHandler(function(res) {
      if (btn) {
        btn.disabled = false;
        btn.innerHTML = '<i class="bi bi-cloud-upload-fill text-orange fs-6"></i>';
      }
      if (res && res.success) {
        showToast(res.message || 'All pending evaluations synced to Team Sheet!', 'success');
        fetchBackendData(false);
      } else {
        showToast('Sync error: ' + ((res && res.error) || 'Failed to sync all'), 'danger');
      }
    })
    .withFailureHandler(function(err) {
      if (btn) {
        btn.disabled = false;
        btn.innerHTML = '<i class="bi bi-cloud-upload-fill text-orange fs-6"></i>';
      }
      showToast('Sync failed: ' + err.message, 'danger');
    })
    .syncAllPendingEvaluations(state.userEmail);
}

// Helper: Escape HTML strings safely
function escapeHtml(str) {
  if (!str) return '';
  var d = document.createElement('div');
  d.appendChild(document.createTextNode(String(str)));
  return d.innerHTML;
}

// Helper: Format date into friendly short format (e.g. Sep 6, 2026)
function formatDateFriendly(dateVal) {
  if (!dateVal) return '-';
  var d = parseLocalDate(dateVal);
  if (!d || isNaN(d.getTime())) return String(dateVal);
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}

// Toggle feedback panel for line items in View Details modal
function toggleEvalDetailFeedback(collapseId) {
  var panel = document.getElementById(collapseId);
  var chevron = document.getElementById('chevron_' + collapseId);
  if (!panel) return;
  var isHidden = panel.classList.contains('d-none');
  if (isHidden) {
    panel.classList.remove('d-none');
    if (chevron) {
      chevron.classList.remove('bi-chevron-right');
      chevron.classList.add('bi-chevron-down');
      chevron.classList.add('text-orange');
      chevron.classList.remove('text-muted');
    }
  } else {
    panel.classList.add('d-none');
    if (chevron) {
      chevron.classList.remove('bi-chevron-down');
      chevron.classList.add('bi-chevron-right');
      chevron.classList.remove('text-orange');
      chevron.classList.add('text-muted');
    }
  }
}

// Helper: Resolve whether a rubric line item answer is correct or incorrect
function resolveLineItemCorrectness(q, sn) {
  if (q.isCorrect !== undefined && q.isCorrect !== null) {
    return (q.isCorrect === true || q.isCorrect === 'true' || q.isCorrect === 1 || q.isCorrect === '1');
  }

  var rubrics = state.rubrics || [];
  var qTitleNorm = String(q.question || q.title || '').trim().toLowerCase();
  var qSelNorm = String(q.selected || q.selectedOption || q.label || '').trim().toLowerCase();

  for (var r = 0; r < rubrics.length; r++) {
    var rub = rubrics[r];
    var struct = rub.structure;
    if (typeof struct === 'string') {
      try { struct = JSON.parse(struct); } catch(e) { struct = null; }
    }
    var sections = Array.isArray(struct) ? struct : (struct && struct.sections ? struct.sections : []);
    for (var s = 0; s < sections.length; s++) {
      var sec = sections[s];
      var items = sec.items || [];
      for (var i = 0; i < items.length; i++) {
        var it = items[i];
        var itTitleNorm = String(it.question || it.title || it.shortName || '').trim().toLowerCase();
        if (itTitleNorm === qTitleNorm) {
          var options = it.options || [];
          for (var o = 0; o < options.length; o++) {
            var opt = options[o];
            var optLabelNorm = String(opt.label || opt.text || '').trim().toLowerCase();
            if (optLabelNorm === qSelNorm) {
              if (opt.isCorrect !== undefined && opt.isCorrect !== null) {
                return (opt.isCorrect === true || opt.isCorrect === 'true');
              }
            }
          }
        }
      }
    }
  }

  // Fallback checks on standard terminology and points
  if (qSelNorm.includes('excelled') || qSelNorm.includes('met') || qSelNorm === 'yes') {
    return true;
  }
  if (qSelNorm.includes('missed') || qSelNorm === 'no') {
    return false;
  }

  var pts = parseFloat(q.points);
  if (!isNaN(pts)) {
    return pts > 0;
  }

  return true;
}

// Helper: Resolve ordered section names from rubric structures to avoid arbitrary JSON key ordering
function getRubricSectionOrder(rubricId) {
  var order = [];
  var rubrics = state.rubrics || [];
  var targetRubric = null;

  if (rubricId) {
    targetRubric = rubrics.find(function(r) { return String(r.id) === String(rubricId); });
  }
  if (!targetRubric && rubrics.length > 0) {
    targetRubric = rubrics[0];
  }

  function addSections(r) {
    if (!r) return;
    var struct = r.structure;
    if (typeof struct === 'string') {
      try { struct = JSON.parse(struct); } catch(e) { struct = null; }
    }
    var secs = Array.isArray(struct) ? struct : (struct && struct.sections ? struct.sections : []);
    secs.forEach(function(sec) {
      var name = (sec.name || sec.title || '').trim();
      if (name && !order.some(function(o) { return o.toLowerCase() === name.toLowerCase(); })) {
        order.push(name);
      }
    });
  }

  if (targetRubric) addSections(targetRubric);
  rubrics.forEach(addSections);

  // Fallback default order for standard Toast QA sections
  var defaultSections = [
    'Knowledgeable & effective problem-solving',
    'Empathy & rapport',
    'Responsive & consistent interactions',
    'Personalization',
    'Customer Handling',
    'Troubleshooting & Process'
  ];
  defaultSections.forEach(function(name) {
    if (!order.some(function(o) { return o.toLowerCase() === name.toLowerCase(); })) {
      order.push(name);
    }
  });

  return order;
}

// Render structured rubric scoresheet with section cards, points badges, and feedback panels
function renderRubricScoresheetHtml(details, rubricId) {
  if (!details) return '<p class="text-muted small fst-italic">No rubric details recorded.</p>';
  if (typeof details === 'string') {
    try { details = JSON.parse(details); } catch(e) { return '<p class="text-muted small fst-italic">No rubric details recorded.</p>'; }
  }
  if (!details || typeof details !== 'object') {
    return '<p class="text-muted small fst-italic">No rubric details recorded.</p>';
  }

  // Remove internal form state keys if present
  if (details.__formState) delete details.__formState;

  var sections = {};

  if (Array.isArray(details)) {
    details.forEach(function(item) {
      if (!item) return;
      var sec = item.sectionName || item.section || 'Rubric Line Items';
      if (!sections[sec]) sections[sec] = [];
      sections[sec].push(item);
    });
  } else {
    var keys = Object.keys(details);
    if (keys.length === 0) return '<p class="text-muted small fst-italic">No rubric details recorded.</p>';

    var isSectionMap = keys.some(function(k) { return Array.isArray(details[k]); });
    if (isSectionMap) {
      keys.forEach(function(sec) {
        var items = details[sec];
        if (Array.isArray(items)) {
          sections[sec] = items;
        } else if (items && typeof items === 'object') {
          sections[sec] = [items];
        }
      });
    } else {
      sections['Rubric Evaluation'] = [];
      keys.forEach(function(k) {
        var val = details[k];
        if (val && typeof val === 'object') {
          sections['Rubric Evaluation'].push(Object.assign({ question: k }, val));
        } else {
          sections['Rubric Evaluation'].push({ question: k, selected: String(val) });
        }
      });
    }
  }

  var rubricSectionOrder = getRubricSectionOrder(rubricId);
  var secKeys = Object.keys(sections);
  if (secKeys.length === 0) {
    return '<p class="text-muted small fst-italic">No rubric details recorded.</p>';
  }

  // Sort sections according to the canonical rubric section sequence
  if (rubricSectionOrder.length > 0) {
    secKeys.sort(function(a, b) {
      var aNorm = a.trim().toLowerCase();
      var bNorm = b.trim().toLowerCase();
      var idxA = rubricSectionOrder.findIndex(function(s) { return s.toLowerCase() === aNorm; });
      var idxB = rubricSectionOrder.findIndex(function(s) { return s.toLowerCase() === bNorm; });
      if (idxA !== -1 && idxB !== -1) return idxA - idxB;
      if (idxA !== -1) return -1;
      if (idxB !== -1) return 1;
      return a.localeCompare(b);
    });
  }

  // Find target rubric object for question ordering
  var targetRubricObj = null;
  if (rubricId) {
    targetRubricObj = (state.rubrics || []).find(function(r) { return String(r.id) === String(rubricId); });
  }
  if (!targetRubricObj && state.rubrics && state.rubrics.length > 0) {
    targetRubricObj = state.rubrics[0];
  }

  var html = '<div class="card border-0 bg-light mb-4 shadow-sm" style="border-radius: 12px; overflow: hidden;">' +
    '<div class="card-header bg-light-orange-subtle py-2.5 px-3 border-0 d-flex justify-content-between align-items-center">' +
      '<span class="fw-bold text-orange small"><i class="bi bi-card-checklist me-2"></i> Rubric Scoresheet</span>' +
      '<span class="badge bg-white text-orange border border-orange-subtle rounded-pill px-2.5 py-1 small fw-bold">' + secKeys.length + ' Section' + (secKeys.length > 1 ? 's' : '') + '</span>' +
    '</div>' +
    '<div class="card-body p-3 bg-white border-top">';

  var sIdx = 0;
  secKeys.forEach(function(sn) {
    var items = (sections[sn] || []).slice();

    // Sort items within section according to canonical rubric item order if available
    if (targetRubricObj) {
      var struct = targetRubricObj.structure;
      if (typeof struct === 'string') {
        try { struct = JSON.parse(struct); } catch(e) {}
      }
      var rSecs = Array.isArray(struct) ? struct : (struct && struct.sections ? struct.sections : []);
      var matchedSec = rSecs.find(function(s) { return (s.name || s.title || '').trim().toLowerCase() === sn.trim().toLowerCase(); });
      if (matchedSec && Array.isArray(matchedSec.items)) {
        var rItemOrder = matchedSec.items.map(function(it) { return (it.question || it.title || it.shortName || '').trim().toLowerCase(); });
        items.sort(function(itemA, itemB) {
          var qA = (itemA.question || itemA.title || itemA.shortName || '').trim().toLowerCase();
          var qB = (itemB.question || itemB.title || itemB.shortName || '').trim().toLowerCase();
          var iA = rItemOrder.indexOf(qA);
          var iB = rItemOrder.indexOf(qB);
          if (iA !== -1 && iB !== -1) return iA - iB;
          if (iA !== -1) return -1;
          if (iB !== -1) return 1;
          return 0;
        });
      }
    }

    html += '<div class="mb-3">' +
      '<h6 class="fw-bold text-dark border-bottom pb-1.5 mb-2 small text-uppercase d-flex justify-content-between align-items-center">' +
        '<span><i class="bi bi-folder2-open text-orange me-2"></i> ' + escapeHtml(sn) + '</span>' +
        '<span class="text-muted fw-normal" style="font-size: 0.72rem;">' + items.length + ' item' + (items.length > 1 ? 's' : '') + '</span>' +
      '</h6>';

    items.forEach(function(q, qi) {
      if (!q) return;
      var collapseId = 'evalFb_' + sIdx + '_' + qi;
      var questionTitle = q.question || q.title || q.shortName || ('Item ' + (qi + 1));
      var selectedAns = q.selected || q.selectedOption || q.label || q.answer || '';
      var fbText = (q.feedback || q.feedbackText || '').trim();
      var chips = Array.isArray(q.feedbackChips) ? q.feedbackChips : [];
      var hasFeedback = (fbText.length > 0) || (chips.length > 0);

      // Resolve points badge based on isCorrect
      var isCorrect = resolveLineItemCorrectness(q, sn);
      var ptsVal = (q.points !== undefined && q.points !== null && q.points !== '') ? Math.abs(parseFloat(q.points)) : 0;
      var ptsBadge = '';

      if (isCorrect) {
        ptsBadge = '<span class="badge bg-success-subtle text-success border border-success-subtle px-2 py-0.5 rounded-pill small fw-bold" style="font-size:0.72rem;"><i class="bi bi-plus-circle me-1"></i>' + ptsVal + ' pts</span>';
      } else {
        ptsBadge = '<span class="badge bg-danger-subtle text-danger border border-danger-subtle px-2 py-0.5 rounded-pill small fw-bold" style="font-size:0.72rem;"><i class="bi bi-dash-circle me-1"></i>' + ptsVal + ' pts</span>';
      }

      html += '<div class="eval-detail-item-card mb-2 rounded overflow-hidden">' +
        '<div class="eval-detail-item-header d-flex justify-content-between align-items-center p-2.5 px-3 rounded hover-bg-light" onclick="toggleEvalDetailFeedback(\'' + collapseId + '\')" role="button" tabindex="0" title="Click to view feedback">' +
          '<div class="d-flex align-items-center gap-2 me-2 flex-grow-1 overflow-hidden">' +
            '<i class="bi bi-chevron-right eval-detail-chevron text-muted small flex-shrink-0" id="chevron_' + collapseId + '"></i>' +
            '<span class="small fw-medium text-dark text-break">' + escapeHtml(questionTitle) + '</span>' +
          '</div>' +
          '<div class="d-flex align-items-center justify-content-end gap-2 flex-shrink-0 ms-2">' +
            (selectedAns ? '<span class="fw-bold text-orange small">' + escapeHtml(selectedAns) + '</span>' : '') +
            ptsBadge +
          '</div>' +
        '</div>' +
        '<div id="' + collapseId + '" class="eval-detail-feedback-panel rounded bg-light p-3 d-none">' +
          (hasFeedback
            ? (fbText ? '<div class="d-flex align-items-start gap-2 text-secondary small mb-2" style="font-size: 0.85rem; line-height: 1.5;"><i class="bi bi-chat-left-text text-orange flex-shrink-0 mt-0.5"></i><div class="flex-grow-1" style="white-space: pre-wrap;">' + escapeHtml(fbText) + '</div></div>' : '') +
              (chips.length > 0 ? '<div class="d-flex flex-wrap gap-1 mt-1">' + chips.map(function(c) { return '<span class="badge bg-white text-secondary border small px-2 py-1"><i class="bi bi-tag-fill text-orange me-1" style="font-size: 0.65rem;"></i>' + escapeHtml(c) + '</span>'; }).join('') + '</div>' : '')
            : '<div class="d-flex align-items-center gap-2 text-muted small fst-italic" style="font-size: 0.82rem;"><i class="bi bi-chat-left-dots flex-shrink-0"></i><span>No feedback entered for this line item.</span></div>'
          ) +
        '</div>' +
      '</div>';
    });

    html += '</div>';
    sIdx++;
  });

  html += '</div></div>';
  return html;
}

// View details modal
function viewDetails(evalId) {
  var ev = state.evaluations.find(function(e){ return e.id === evalId; });
  if (!ev) return;

  var asg = state.assignments.find(function(a){ return a.id === ev.assignment_id; });
  var snap = ev.agent_snapshot || (asg && asg.agent_snapshot) || {};
  if (typeof snap === 'string') {
    try { snap = JSON.parse(snap); } catch(e) { snap = {}; }
  }

  var agentDisplayName = ev.agent_name || (snap.fullName || snap.displayName) || (asg && asg.agent_name) || 'Unknown Agent';
  var supervisorName = snap.supervisor || (asg && asg.supervisor) || '-';
  var locationName = snap.location || (asg && asg.location) || '-';
  var scoreVal = (ev.score !== undefined && ev.score !== null) ? Number(ev.score).toFixed(1) : 0;

  document.getElementById('detailsModalAgentName').textContent = agentDisplayName;

  // 1. Top Details Card
  var content = '<div class="card border-0 bg-light mb-4 shadow-sm" style="border-radius: 12px; overflow: hidden;">' +
    '<div class="card-header bg-orange text-white py-2 px-3 border-0">' +
      '<span class="fw-bold small"><i class="bi bi-info-circle me-2"></i> Interaction Details</span>' +
    '</div>' +
    '<div class="card-body p-3 bg-white border-top">' +
      '<div class="row g-3 mb-2">' +
        '<div class="col-md-6"><label class="form-label small fw-bold text-muted d-block mb-0">AGENT NAME</label><span class="small text-dark fw-semibold">' + escapeHtml(agentDisplayName) + '</span></div>' +
        '<div class="col-md-6"><label class="form-label small fw-bold text-muted d-block mb-0">SCORE</label><span class="badge bg-orange-light text-orange border border-orange-subtle fs-6 px-3 py-1 fw-bold">' + scoreVal + '%</span></div>' +
      '</div>' +
      '<div class="row g-3 mb-2">' +
        '<div class="col-md-6"><label class="form-label small fw-bold text-muted d-block mb-0">SUPERVISOR</label><span class="small text-dark">' + escapeHtml(supervisorName) + '</span></div>' +
        '<div class="col-md-6"><label class="form-label small fw-bold text-muted d-block mb-0">LOCATION</label><span class="small text-dark">' + escapeHtml(locationName) + '</span></div>' +
      '</div>' +
      '<div class="row g-3 mb-2">' +
        '<div class="col-md-6"><label class="form-label small fw-bold text-muted d-block mb-0">INTERACTION ID</label><span class="small text-dark font-monospace">' + escapeHtml(ev.interaction_id || '-') + '</span></div>' +
        '<div class="col-md-6"><label class="form-label small fw-bold text-muted d-block mb-0">CASE NO.</label><span class="small text-dark font-monospace">' + escapeHtml(ev.case_no || '-') + '</span></div>' +
      '</div>' +
      '<div class="row g-3 mb-2">' +
        '<div class="col-md-6"><label class="form-label small fw-bold text-muted d-block mb-0">EVALUATION DATE</label><span class="small text-dark">' + formatDateFriendly(ev.submitted_at || ev.evaluation_date || ev.created_at) + '</span></div>' +
        '<div class="col-md-6"><label class="form-label small fw-bold text-muted d-block mb-0">INTERACTION DATE</label><span class="small text-dark">' + formatDateFriendly(ev.date_of_interaction) + '</span></div>' +
      '</div>' +
      '<div class="row g-3 mb-2">' +
        '<div class="col-md-6"><label class="form-label small fw-bold text-muted d-block mb-0">DURATION</label><span class="small text-dark">' + escapeHtml(ev.call_duration || '-') + '</span></div>' +
        '<div class="col-md-6"><label class="form-label small fw-bold text-muted d-block mb-0">EVALUATION TYPE</label><span class="small text-dark">' + escapeHtml(ev.evaluation_type || (asg && asg.evaluation_type) || 'Manual Audit') + '</span></div>' +
      '</div>' +
      '<div class="row g-3 mb-0">' +
        '<div class="col-md-6"><label class="form-label small fw-bold text-muted d-block mb-0">CATEGORY</label><span class="small text-dark">' + escapeHtml(ev.case_category || '-') + '</span></div>' +
        '<div class="col-md-6"><label class="form-label small fw-bold text-muted d-block mb-0">SUB-CATEGORY</label><span class="small text-dark">' + escapeHtml(ev.case_sub_category || '-') + '</span></div>' +
      '</div>' +
    '</div>' +
  '</div>';

  if (ev.ticket_link || ev.ticketLink) {
    var linkUrl = ev.ticket_link || ev.ticketLink;
    content += '<div class="mb-3">' +
      '<label class="form-label small fw-bold text-muted d-block mb-1">TICKET LINK</label>' +
      '<a href="' + escapeHtml(linkUrl) + '" target="_blank" class="text-orange fw-medium text-break small"><i class="bi bi-box-arrow-up-right me-1"></i> ' + escapeHtml(linkUrl) + '</a>' +
    '</div>';
  }

  // 2. Issue / Concern (Placed BEFORE the Rubric Scoresheet as requested)
  if (ev.issue_concern) {
    content += '<div class="mb-4">' +
      '<label class="form-label small fw-bold text-muted d-block mb-1 text-uppercase"><i class="bi bi-exclamation-triangle me-2 text-orange"></i> Issue / Concern</label>' +
      '<div class="bg-light p-3 rounded border text-secondary" style="white-space: pre-wrap; font-size: 0.85rem; line-height: 1.5;">' + escapeHtml(ev.issue_concern) + '</div>' +
    '</div>';
  }

  // 3. Rubric Breakdown Scoresheet
  var rawDetails = ev.evaluation_details || ev.evaluationDetails || ev.details;
  var rubricId = ev.rubric_id || ev.rubricId || (asg && (asg.rubric_id || asg.rubricId)) || '';
  content += renderRubricScoresheetHtml(rawDetails, rubricId);

  // 4. Coaching Comments / Notes
  if (ev.comments) {
    content += '<div class="mb-3">' +
      '<label class="form-label small fw-bold text-muted d-block mb-1 text-uppercase"><i class="bi bi-chat-quote me-2 text-orange"></i> Coaching Comments / Notes</label>' +
      '<div class="bg-light p-3 rounded border text-secondary" style="white-space: pre-wrap; font-size: 0.85rem; line-height: 1.5;">' + escapeHtml(ev.comments) + '</div>' +
    '</div>';
  }

  document.getElementById('detailsModalContent').innerHTML = content;
  var modal = new bootstrap.Modal(document.getElementById('viewEvalDetailsModal'));
  modal.show();
}

// Toast notification helper
function showToast(msg, type) {
  var alertDiv = document.createElement('div');
  alertDiv.className = 'alert alert-' + (type || 'info') + ' alert-dismissible fade show position-fixed shadow-lg';
  alertDiv.style.cssText = 'bottom: 20px; right: 20px; z-index: 9999; max-width: 400px; border-radius: 10px;';
  alertDiv.innerHTML = '<span>' + msg + '</span><button type="button" class="btn-close" data-bs-dismiss="alert"></button>';
  document.body.appendChild(alertDiv);
  setTimeout(function() {
    if (alertDiv.parentNode) alertDiv.parentNode.removeChild(alertDiv);
  }, 4000);
}
</script>
